# Cloudflare Workers の設定（デプロイは `npx wrangler deploy`）。
#
# 構成:
#   public/  … 配信する静的ファイル（ゲーム本体・アイコン・プライバシーポリシー）
#   worker/  … /api/* を処理する Worker。index.js が入口
#
# 秘密情報（GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / SESSION_SECRET）はここに書かない。
# ダッシュボードの Settings → Variables and Secrets、または `npx wrangler secret put <名前>` で登録する
# （Secret は wrangler deploy で消えない）。未設定の間は同期 API が 503 を返し、
# ゲームはこれまでどおり localStorage だけで動く。

name = "juroku"
main = "worker/index.js"
compatibility_date = "2026-08-16"

[assets]
directory = "./public"
binding = "ASSETS"

# ── 記録の同期に使う KV ──
# 作成コマンド: npx wrangler kv namespace create JUROKU_KV
# id は秘密情報ではない（この値だけでは中身を読めない）。アクセスできるのはこの Worker と
# アカウント所有者だけなので、リポジトリに置いてよい。
[[kv_namespaces]]
binding = "JUROKU_KV"
id = "0a98f98800b14a4ca4ee6e9c8f1aaab7"
